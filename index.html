<html lang="en">

<title>TV Today</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e8eaef;--muted:#9aa1ae;
  --accent:#f5b544;--accent2:#5fb3ff;--good:#57d18a;--bad:#ff6b6b;--chip:#252a35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0 8px 0 0;letter-spacing:.3px}h1 span{color:var(--accent)}
.datenav{display:flex;align-items:center;gap:6px}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:#3c4352}
button.primary{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:600}
#dateLabel{font-weight:600;min-width:170px;text-align:center}
.spacer{flex:1}
input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;width:200px}
.tabs{max-width:1200px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap}
.tab{border-radius:999px;padding:4px 12px}
.tab.on{background:var(--accent2);color:#04121f;border-color:var(--accent2);font-weight:600}
.tab .n{opacity:.75;margin-left:4px;font-size:12px}
main{max-width:1200px;margin:0 auto;padding:16px}
section{margin:0 0 26px}
section>h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
section>h2 .count{color:var(--muted);font-weight:400;font-size:13px}
section>h2 .caret{color:var(--muted);font-size:12px;width:12px}
section.collapsed .grid{display:none}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.card{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative}
.card.watch{border-color:#6b5420;background:linear-gradient(180deg,#1d1a12,var(--panel))}
.poster{width:64px;height:92px;flex:none;border-radius:6px;background:var(--panel2) center/cover no-repeat}
.body{flex:1;min-width:0}
.title{font-weight:650;font-size:15px;line-height:1.25;margin-right:56px}
.title a{color:var(--text)}
.ep{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{background:var(--chip);border-radius:5px;padding:1px 6px;font-size:11.5px;color:#c9ced8;white-space:nowrap}
.chip.net{background:#23324a;color:#bcd8ff}
.chip.new{background:#1f3d2b;color:#8ff0b5;font-weight:600}
.chip.prem{background:#3a3420;color:#ffd98a;font-weight:600}
.chip.match{background:#3b2340;color:#f3b6ff;font-weight:600}
.chip.lib{background:#40301a;color:#ffc979}
.chip.kids{background:#1d3a3f;color:#8fe3ef}
.chip.time{background:transparent;border:1px solid var(--line)}
.links{margin-top:6px;font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.summary{display:none;margin-top:6px;font-size:13px;color:#c3c8d2}
.card.open .summary{display:block}
.acts{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.acts button{padding:2px 7px;font-size:14px;line-height:1.2;background:transparent}
.acts .star.on{color:var(--accent);border-color:#6b5420}
.acts .hide:hover{color:var(--bad);border-color:var(--bad)}
.status{color:var(--muted);padding:30px 0;text-align:center}

#drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#drawer.on{display:block}

label.opt small{display:block;color:var(--muted);font-size:12px}
.list{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto}
.list div{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.list div:last-child{border-bottom:0}
.list .empty{color:var(--muted);justify-content:center}
textarea{width:100%;height:90px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;font:12px monospace;padding:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b3140;border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:30}
.toast button{margin-left:10px}
.syncst{font-size:12px;color:var(--muted)}.syncst.ok{color:var(--good)}.syncst.error{color:var(--bad)}
input[type=password]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
</style>

<body>
<header>
  <div class="bar">
    <h1>TV <span>Today</span></h1>

<div id="drawer"><div class="panel" id="panel"></div></div>

<script>
"use strict";
// TV Today — new TV (US, UK, streaming) and anime airing today.
// Data: TVmaze (api.tvmaze.com) and AniList (graphql.anilist.co).
// Your settings live in this browser (localStorage).

// ---------- Shows you already like (seeded from your library + likes) ----------
const SEED_TITLES = [
 // library series
 "Berserk","Chainsaw Man","Demon Slayer","KonoSuba","One Punch Man","Pokemon","Solo Leveling","Sword Art Online",
 "Baby Assassins Everyday","Battle Angel Alita","Blade of the Immortal","Chainsmoker Cat","Claymore","Cowboy Bebop",
 "Cyberpunk Edgerunners","Delicious in Dungeon","Dungeon Meshi","Dororo","Dragon Ball","Dragon Ball Z","Dragon Ball GT","Dragon Ball Daima","Dragon Ball Super",
 "Gatchaman","Hell Mode","How Not to Summon a Demon Lord","Iron Man","Is It Wrong to Try to Pick Up Girls in a Dungeon","Danmachi",
 "Killed Again Mr Detective","Monster Rancher","Nia Liston","One Piece","Rick and Morty The Anime","Rooster Fighter",
 "The Cat and the Dragon","The Eminence in Shadow","The Seven Deadly Sins","Speed Racer","Terminator Zero","Wolverine","X-Men","Samurai Pizza Cats",
 // shows you've said you like
 "Aeon Flux","Skeleton Warriors","The Maxx","Samurai Jack","Hit-Monkey","Golden Axe","Misfit of Demon King Academy","Magic Repo Man",
 "Black Clover","Tomb Raider King","The World's Finest Assassin","The Fruit of Evolution","My Unique Skill Makes Me OP Even at Level 1",
 "Level 9999 Unlimited Gacha","Unlimited Gacha","The Wrong Way to Use Healing Magic","Uglymug Epicfighter","Shangri-La Frontier",
 "A Wild Last Boss Appeared","Berserk of Gluttony","Arifureta","The Rising of the Shield Hero","Overlord","Frieren","Sakamoto Days",
 "The Ossan Newbie Adventurer","Bofuri","Skeleton Knight in Another World","That Time I Got Reincarnated as a Slime",
 "I May Be a Guild Receptionist","Yu Yu Hakusho","Reborn as a Vending Machine"
];

// ---------- Anime taste profile (from your library: isekai, dark fantasy, action, comedy fantasy) ----------
const TAG_W = {
 "Isekai":4,"Reincarnation":3,"Video Games":2,"Dungeon":2,"Swordplay":2,"Demons":2,"Gore":2,"Anti-Hero":2,"Assassins":2,
 "Cats":2,"Skeleton":2,"Martial Arts":2,"Cyberpunk":2,"Samurai":2,"Super Power":1,"Magic":1,"Seinen":1,"Shounen":1,"Revenge":1,
 "Dragons":1,"Male Protagonist":1,"Survival":1,"Mercenary":1,"Ninja":1,"Guns":1,"Gods":1,"Elf":1,"Primarily Adult Cast":1,
 "Parody":1,"Slapstick":1,"Satire":1,"Cultivation":1,"Body Horror":1,"Monster Girl":0,
 "Idol":-3,"Kids":-3,"Shoujo":-2,"Cute Girls Doing Cute Things":-2,"Boys' Love":-2,"Iyashikei":-1,"Josei":-1,"Yuri":-1,
 "Primarily Female Cast":-1,"Office Lady":-1,"Female Harem":0
};
const GENRE_W = {"Action":2,"Fantasy":2,"Adventure":1,"Comedy":1,"Horror":1,"Supernatural":1,"Sci-Fi":1,
 "Romance":-1,"Slice of Life":-1,"Sports":-2,"Mahou Shoujo":-2,"Music":-2};
const STRONG_MATCH = 7, MAYBE_MATCH = 4;

// ---------- Filter heuristics ----------
const KIDS_NETWORKS = /^(Nickelodeon|Nick Jr\.?|Nicktoons|Disney Channel|Disney Junior|Disney XD|PBS Kids|CBBC|CBeebies|Universal Kids|Cartoonito|Boomerang|Baby ?TV|Discovery Family|Milkshake!?|CITV|Tiny Pop|Pop)$/i;
const PRESCHOOL_NETWORKS = /^(Nick Jr\.?|Disney Junior|Disney Jr\.?|CBeebies|PBS Kids|Baby ?TV|Milkshake!?|Cartoonito|Tiny Pop|Noggin|Sprout)$/i;
const KIDS_OK_TV = ["Action","Adventure","Science-Fiction","Fantasy","Supernatural"];
const KIDS_OK_ANIME = ["Action","Adventure","Sci-Fi","Fantasy"];
const KJ_GENRES = ["Science-Fiction","Fantasy","Horror","Supernatural","Action"];  // add "Thriller" here to include thrillers
const DATING_WORDS = /(love island|hunt for love|bachelor|bachelorette|love is blind|married at first sight|90 day|too hot to handle|temptation island|perfect match|are you the one|ex on the beach|fboy island|first dates|naked attraction|farmer wants a wife|dating|love triangle|love after lockup|my mom, your dad|the ultimatum|single'?s inferno|marriage pact|match ?made|love ?u?nder|later dating|i kissed a boy|i kissed a girl|love on the spectrum)/i;
const KNOWN_SOAPS = /^(general hospital|days of our lives|the young and the restless|the bold and the beautiful|beyond the gates|eastenders|coronation street|emmerdale|hollyoaks|doctors|neighbours|home and away|river city|pobol y cwm|fair city|shortland street)$/i;
const MAJOR_STREAMERS = /^(Netflix|Prime Video|Amazon Prime Video|Disney\+|HBO Max|Max|Apple TV\+?|Hulu|Peacock|Paramount\+|Crunchyroll|HIDIVE|Shudder|AMC\+|BritBox|Acorn TV|BBC iPlayer|ITVX|Channel 4|Tubi|The Roku Channel|Adult Swim|Dropout|MGM\+|Starz|Showtime|Freevee)$/i;
const UK_MAIN = /^(BBC One|BBC Two|BBC Three|BBC iPlayer|ITV1|ITV|ITVX|Channel 4)$/i;

// ---------- Settings (localStorage) ----------
const STORE = "tvtoday.v1";
const DEFAULTS = {
  hidden:{},       // key -> {title, at}
  watching:{},     // key -> title   (manually starred)
  unwatch:{},      // key -> title   (seed matches you turned off)
  filters:{kids:true,dating:true,talk:true,soap:true,sports:true,news:true,foreignWeb:true,kjOther:true},
  collapsed:{}
};
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE)||"null"); if(s) return merge(structuredClone(DEFAULTS), s); }catch(e){}
  return structuredClone(DEFAULTS);
}
function merge(a,b){ for(const k in b){ if(b[k] && typeof b[k]==="object" && !Array.isArray(b[k]) && a[k] && typeof a[k]==="object") merge(a[k],b[k]); else a[k]=b[k]; } return a; }
function saveLocal(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
function save(){ S.updatedAt = Date.now(); saveLocal(); schedulePush(); }

// ---------- Sync between devices (private GitHub gist) ----------
const SYNC_KEY = "tvtoday.sync", GIST_FILE = "tvtoday-settings.json";
let SY = (() => { try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||"null") || {}; }catch(e){ return {}; } })();
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); }catch(e){} }
const syncOn = () => !!(SY.token && SY.gistId);
function setSync(state, msg){
  const el = document.getElementById("syncStatus"); if(!el) return;
  el.className = "syncst " + state;
  el.textContent = state==="busy" ? "Syncing…" : state==="ok" ? "✓ Synced" : state==="error" ? "⚠ Sync error" : "";
  el.title = msg || "";
}
async function gh(path, opts){
  opts = opts || {};
  const headers = {"Accept":"application/vnd.github+json", "Authorization":"Bearer "+SY.token};
  if(opts.body) headers["Content-Type"] = "application/json";
  const r = await fetch("https://api.github.com"+path, {method: opts.method||"GET", headers, body: opts.body, cache:"no-store"});
  if(!r.ok) throw new Error("GitHub said "+r.status+(r.status===401?" — the token wasn't accepted (expired or mistyped?)":r.status===404?" — settings gist not found":""));
  return r.json();
}
function syncPayload(){ return JSON.stringify({updatedAt:S.updatedAt||0, hidden:S.hidden, watching:S.watching, unwatch:S.unwatch, filters:S.filters}, null, 1); }
async function findOrCreateGist(){
  for(let p = 1; p <= 5; p++){
    const list = await gh(`/gists?per_page=100&page=${p}`);
    const g = list.find(x => x.files && x.files[GIST_FILE]);
    if(g) return g.id;
    if(list.length < 100) break;
  }
  const g = await gh("/gists", {method:"POST", body: JSON.stringify({description:"TV Today settings (synced between devices)", public:false, files:{[GIST_FILE]:{content:syncPayload()}}})});
  return g.id;
}
async function pull(){
  if(!syncOn()) return;
  setSync("busy");
  try{
    const g = await gh("/gists/"+SY.gistId);
    const f = g.files && g.files[GIST_FILE];
    let remote = null;
    if(f){ try{ remote = JSON.parse(f.truncated ? await (await fetch(f.raw_url)).text() : f.content); }catch(e){ remote = null; } }
    if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
      S.hidden = remote.hidden || {}; S.watching = remote.watching || {}; S.unwatch = remote.unwatch || {};
      S.filters = merge(structuredClone(DEFAULTS.filters), remote.filters || {});
      S.updatedAt = remote.updatedAt;
      saveLocal(); if(items.length) render();
    } else if(!remote || (S.updatedAt||0) > (remote.updatedAt||0)){
      await push(true);
    }
    setSync("ok");
  }catch(e){ setSync("error", e.message); }
}
let pushTimer = null;
function schedulePush(){ if(!syncOn()) return; clearTimeout(pushTimer); pushTimer = setTimeout(() => push(), 1200); }
async function push(inner){
  if(!syncOn()) return;
  if(!inner) setSync("busy");
  try{
    await gh("/gists/"+SY.gistId, {method:"PATCH", body: JSON.stringify({files:{[GIST_FILE]:{content:syncPayload()}}})});
    if(!inner) setSync("ok");
  }catch(e){ setSync("error", e.message); if(inner) throw e; }
}

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\/[^\s'"()<>\\]+$/i.test(String(u||"")) ? String(u) : "";
const strip = s => String(s||"").replace(/<br\s*\/?>/gi," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
const norm = s => " "+String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/&/g," and ").replace(/['’]/g,"").replace(/[^a-z0-9]+/g," ").trim()+" ";
const SEEDS = SEED_TITLES.map(norm);
function seedMatch(titles){ const ns = titles.filter(Boolean).map(norm); return SEEDS.some(sd => ns.some(t => t.startsWith(sd) || (sd.length>8 && t.includes(sd)))); }
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtTime = d => d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

let day = new Date(); day.setHours(0,0,0,0);
let items = [];
let activeTab = "all";

// ---------- Fetch: TVmaze ----------
async function getJSON(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error(url.split("?")[0]+" → HTTP "+r.status);
  return r.json();
}
async function fetchTVmaze(dateStr){
  const [us, ca, gb, web, kr, jp] = await Promise.all([
    getJSON(`https://api.tvmaze.com/schedule?country=US&date=${dateStr}`),
    getJSON(`https://api.tvmaze.com/schedule?country=CA&date=${dateStr}`),
    getJSON(`https://api.tvmaze.com/schedule?country=GB&date=${dateStr}`),
    getJSON(`https://api.tvmaze.com/schedule/web?date=${dateStr}`),
    getJSON(`https://api.tvmaze.com/schedule?country=KR&date=${dateStr}`).catch(() => []),
    getJSON(`https://api.tvmaze.com/schedule?country=JP&date=${dateStr}`).catch(() => [])
  ]);
  const out = [];
  const add = (ep, show, region) => out.push({ep, show, region});
  us.forEach(e => add(e, e.show, "US"));
  ca.forEach(e => { if(e.show && e.show.language === "English") add(e, e.show, "Canada"); });  // English-language Canadian channels only
  gb.forEach(e => add(e, e.show, "UK"));
  web.forEach(e => add(e, e._embedded && e._embedded.show, "Streaming"));
  kr.forEach(e => add(e, e.show, "KJ"));
  jp.forEach(e => add(e, e.show, "KJ"));
  return out.filter(x => x.show);
}

// ---------- Fetch: AniList ----------
const AL_Q = `query($s:Int,$e:Int,$p:Int){Page(page:$p,perPage:50){pageInfo{hasNextPage}
 airingSchedules(airingAt_greater:$s,airingAt_lesser:$e,sort:TIME){airingAt episode
  media{id siteUrl isAdult format countryOfOrigin episodes status title{romaji english} synonyms genres
   tags{name rank} coverImage{medium} description(asHtml:false) externalLinks{site url type} season seasonYear}}}}`;
async function fetchAniList(start, end){
  let p = 1, all = [];
  while(p <= 6){
    const j = await getJSON("https://graphql.anilist.co", {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({query:AL_Q, variables:{s:Math.floor(start/1000)-1, e:Math.floor(end/1000), p}})});
    if(j.errors) throw new Error("AniList: "+j.errors.map(e=>e.message).join("; "));
    all = all.concat(j.data.Page.airingSchedules);
    if(!j.data.Page.pageInfo.hasNextPage) break;
    p++;
  }
  return all;
}

// ---------- Fetch: Watchmode (new on streaming services) ----------
const WM_KEY_STORE = "tvtoday.wmkey", WM_CACHE = "tvtoday.wmcache";
const WM_SERVICES = {203:"Netflix", 157:"Hulu", 634:"Hulu", 372:"Disney+", 387:"HBO Max", 389:"Peacock", 388:"Peacock", 444:"Paramount+", 371:"Apple TV+"};
const wmKey = () => { try{ return localStorage.getItem(WM_KEY_STORE) || ""; }catch(e){ return ""; } };
const shiftDate = (dateStr, n) => { const d = new Date(dateStr+"T12:00:00"); d.setDate(d.getDate()+n); return ymd(d); };
async function fetchWatchmode(dateStr){
  const key = wmKey(); if(!key) return null;
  let cache = {}; try{ cache = JSON.parse(localStorage.getItem(WM_CACHE)||"{}"); }catch(e){}
  const c = cache[dateStr];
  if(c && Date.now() - c.at < 6*3600*1000) return c.rows;   // reuse for 6 hours to save your free quota
  const sd = shiftDate(dateStr,-1).replace(/-/g,""), ed = shiftDate(dateStr,1).replace(/-/g,"");
  const r = await fetch(`https://api.watchmode.com/v1/releases/?start_date=${sd}&end_date=${ed}&limit=250`, {headers:{"X-API-Key":key}});
  if(r.status === 401) throw new Error("Watchmode didn't accept your key — check it in ⚙ Settings");
  if(r.status === 429) throw new Error("Watchmode's monthly free quota is used up");
  if(!r.ok) throw new Error("Watchmode → HTTP "+r.status);
  const j = await r.json();
  const rows = (j.releases||[]).filter(x => WM_SERVICES[x.source_id]);
  // keep the cache small: last 10 days looked at
  cache[dateStr] = {at:Date.now(), rows};
  const keys = Object.keys(cache).sort((a,b)=> cache[b].at - cache[a].at).slice(0,10);
  try{ localStorage.setItem(WM_CACHE, JSON.stringify(Object.fromEntries(keys.map(k=>[k,cache[k]])))); }catch(e){}
  return rows;
}
function buildWatchmode(rows, dateStr){
  const groups = new Map();
  for(const x of rows||[]){
    if(String(x.source_release_date||"").slice(0,10) !== dateStr) continue;
    const key = "wm:"+x.id;
    let g = groups.get(key);
    const svc = WM_SERVICES[x.source_id];
    if(!g){
      const tvType = /tv/.test(x.type||"");
      const label = {movie:"Movie", tv_series:"TV series", tv_miniseries:"Miniseries", tv_special:"TV special", short_film:"Short film", tv_movie:"TV movie"}[x.type] || (tvType ? "TV" : "Movie");
      g = {key, kind:"wm", title:x.title, titles:[x.title], services:[], original: !!Number(x.is_original), image: safeUrl(x.poster_url),
           imdb: /^tt\d+$/.test(x.imdb_id||"") ? x.imdb_id : "", tmdb: x.tmdb_id ? `${x.tmdb_type==="tv"?"tv":"movie"}/${Number(x.tmdb_id)}` : "",
           epLabel: label + (x.season_number ? ` · Season ${Number(x.season_number)}` : ""), genres:[], category:"", region:"WM"};
      g.link = g.imdb ? `https://www.imdb.com/title/${g.imdb}/` : (g.tmdb ? `https://www.themoviedb.org/${g.tmdb}` : "");
      groups.set(key, g);
    }
    if(!g.services.includes(svc)) g.services.push(svc);
    if(Number(x.is_original)) g.original = true;
  }
  return [...groups.values()].map(g => (g.channel = g.services.join(" · "), g));
}

// ---------- Normalize into cards ----------
function buildTV(rows, dateStr){
  const groups = new Map();
  for(const {ep, show, region} of rows){
    const ch = show.webChannel || show.network || {};
    const chCountry = ch.country ? ch.country.code : null;
    // anime is handled by AniList
    if((show.genres||[]).includes("Anime")) continue;
    const key = "tvm:"+show.id;
    let g = groups.get(key);
    if(!g){
      g = {key, kind:"tv", title:show.name, show, region, channel:ch.name||"", chCountry, eps:[], titles:[show.name],
           image: safeUrl(show.image && (show.image.medium||show.image.original)), link: safeUrl(show.url), site: safeUrl(show.officialSite),
           summary: strip(show.summary), genres: show.genres||[], type: show.type, language: show.language};
      groups.set(key, g);
    }
    if(!g.eps.some(x => x.id === ep.id)) g.eps.push(ep);
  }
  const out = [];
  for(const g of groups.values()){
    g.eps.sort((a,b) => (a.season-b.season) || ((a.number||0)-(b.number||0)));
    const f = g.eps[0], l = g.eps[g.eps.length-1];
    g.time = f.airstamp ? new Date(f.airstamp) : null;
    g.streamDrop = g.region==="Streaming" && !f.airtime;
    g.isNewSeries = g.eps.some(e => e.season===1 && e.number===1) || (g.show.premiered === dateStr);
    g.isSeasonPremiere = !g.isNewSeries && g.eps.some(e => e.number===1 && e.season>1);
    const sn = e => e.number!=null ? `S${e.season}E${e.number}` : (e.type==="significant_special" ? "Special" : "Special");
    g.epLabel = g.eps.length>1 ? `${sn(f)}–${l.number!=null?"E"+l.number:""} (${g.eps.length} episodes)` : sn(f);
    g.epTitle = g.eps.length===1 && f.name && !/^(episode|chapter|part) \d+$/i.test(f.name) ? f.name : "";
    g.airtime = f.airtime || "";
    g.category = classifyTV(g);
    out.push(g);
  }
  return out;
}
function classifyTV(g){
  const t = g.type, gen = g.genres, name = g.title, ch = g.channel;
  const days = (g.show.schedule && g.show.schedule.days) || [];
  if(t === "News") return "news";
  if(t === "Sports" || gen.includes("Sports")) return "sports";
  if(PRESCHOOL_NETWORKS.test(ch)) return "kids";
  if(gen.includes("Children") || KIDS_NETWORKS.test(ch)){
    if(gen.some(x => KIDS_OK_TV.includes(x))) g.kidsLabel = true;  // action/adventure/sci-fi/fantasy kids' shows get through
    else return "kids";
  }
  if(t === "Talk Show" && g.airtime && g.airtime < "17:00") return "talk";
  if(t === "Reality" && (gen.includes("Romance") || DATING_WORDS.test(name))) return "dating";
  if(KNOWN_SOAPS.test(name) || (t === "Scripted" && days.length >= 5 && (gen.includes("Drama") || gen.includes("Romance") || gen.length===0))) return "soap";
  // Korean & Japanese live action: only scripted shows in your genres that have an IMDb listing or are popular on TVmaze
  const kj = g.language === "Korean" || g.language === "Japanese";
  if(g.region === "KJ" || (kj && g.region === "Streaming")){
    if(kj && g.region === "Streaming" && MAJOR_STREAMERS.test(ch)){ g.region = "KJ"; return ""; }  // Netflix, Disney+ etc. always show
    if(t === "Animation" || gen.includes("Anime")) return "kjOther";                                // anime comes from AniList
    if(t === "Scripted" && gen.some(x => KJ_GENRES.includes(x)) && ((g.show.externals && g.show.externals.imdb) || (g.show.weight||0) >= 80)){ g.region = "KJ"; return ""; }
    return "kjOther";
  }
  // English-language shows from any country's streamers always get through (Australia, NZ, Canada, Ireland…)
  if(g.region === "Streaming" && g.chCountry && !["US","GB"].includes(g.chCountry) && g.language !== "English") return "foreignWeb";
  if(g.region === "Streaming" && !g.chCountry && g.language && g.language !== "English" && !MAJOR_STREAMERS.test(ch)) return "foreignWeb";
  return "";
}

function buildAnime(rows){
  const groups = new Map();
  for(const r of rows){
    const m = r.media;
    if(!m || m.isAdult) continue;
    if(!["TV","TV_SHORT","ONA","SPECIAL","OVA"].includes(m.format)) continue;
    const key = "al:"+m.id;
    let g = groups.get(key);
    const title = m.title.english || m.title.romaji;
    if(!g){
      const tags = (m.tags||[]).filter(t => t.rank >= 40).map(t => t.name);
      let score = 0;
      tags.forEach(t => score += (TAG_W[t]||0));
      (m.genres||[]).forEach(x => score += (GENRE_W[x]||0));
      const links = (m.externalLinks||[]).filter(l => l.type==="STREAMING" || /crunchyroll|hidive|netflix|hulu|prime|disney|max|bilibili|youtube/i.test(l.site));
      const uniq = []; const seen = new Set();
      links.forEach(l => { l.url = safeUrl(l.url); if(l.url && !seen.has(l.site)){ seen.add(l.site); uniq.push(l); } });
      g = {key, kind:"anime", title, alt: m.title.english && m.title.romaji !== m.title.english ? m.title.romaji : "",
           titles:[m.title.english, m.title.romaji, ...(m.synonyms||[])], eps:[], image: safeUrl(m.coverImage && m.coverImage.medium),
           link: safeUrl(m.siteUrl), streams: uniq, genres: m.genres||[], tags, score, country: m.countryOfOrigin, format: m.format,
           totalEps: m.episodes, summary: strip(m.description)};
      const kidsTag = (m.tags||[]).some(t => t.name==="Kids" && t.rank>=50);
      const kidsOk = kidsTag && (m.genres||[]).some(x => KIDS_OK_ANIME.includes(x));
      g.kidsLabel = kidsOk;
      g.category = (m.genres||[]).includes("Sports") ? "sports" : (kidsTag && !kidsOk ? "kids" : "");
      groups.set(key, g);
    }
    g.eps.push(r);
  }
  const out = [];
  for(const g of groups.values()){
    g.eps.sort((a,b) => a.episode - b.episode);
    const f = g.eps[0], l = g.eps[g.eps.length-1];
    g.time = new Date(f.airingAt*1000);
    g.epLabel = g.eps.length>1 ? `Episodes ${f.episode}–${l.episode}` : `Episode ${f.episode}${g.totalEps ? " of "+g.totalEps : ""}`;
    g.isNewSeries = f.episode === 1;
    g.isSeasonPremiere = false;
    g.region = "Anime";
    g.channel = g.streams.length ? g.streams.map(s=>s.site).slice(0,3).join(" · ") : "Japan TV";
    out.push(g);
  }
  return out;
}

// ---------- Status helpers ----------
const isWatching = g => !!S.watching[g.key] || (!S.unwatch[g.key] && seedMatch(g.titles));
const isSeeded = g => !S.watching[g.key] && !S.unwatch[g.key] && seedMatch(g.titles);
const isHidden = g => !!S.hidden[g.key];
const filteredOut = g => g.category && S.filters[g.category] && !isWatching(g);

// ---------- Render ----------
const FILTER_LABELS = {kids:"Kids shows", dating:"Reality dating", talk:"Daytime talk", soap:"Soap operas", sports:"Sports",
  news:"News", foreignWeb:"Non-English streaming", kjOther:"Other Korean & Japanese shows"};

function sections(){
  const q = norm($("#q").value).trim();
  const wmTitles = new Set(items.filter(g => g.kind==="wm").map(g => norm(g.title)));
  const dupOfWm = g => g.kind==="tv" && g.region==="Streaming" && wmTitles.has(norm(g.title)) && !isWatching(g);   // already listed under "New on streaming"
  const vis = items.filter(g => !isHidden(g) && !filteredOut(g) && !dupOfWm(g) && (!q || g.titles.some(t => norm(t).includes(q))));
  const used = new Set();
  const take = (fn) => { const r = vis.filter(g => !used.has(g.key) && fn(g)); r.forEach(g=>used.add(g.key)); return r; };
  const byTime = (a,b) => (a.time||0) - (b.time||0);
  const out = [];
  out.push({id:"watching", title:"★ Shows you watch", sub:"Shows you've starred, plus matches from your library and favorites.", list: take(isWatching).sort(byTime)});
  out.push({id:"new", title:"New series", sub:"Series premieres (Season 1, Episode 1) — TV and anime.", list: take(g => g.isNewSeries).sort((a,b)=> (a.kind===b.kind?0:a.kind==="anime"?1:-1) || byTime(a,b))});
  out.push({id:"season", title:"Season premieres", sub:"Returning shows starting a new season.", list: take(g => g.isSeasonPremiere).sort(byTime)});
  const byName = (a,b) => a.title.localeCompare(b.title);
  out.push({id:"wmOrig", title:"New on streaming: Originals", sub:"Netflix, Disney+, Hulu, HBO Max, Peacock, Paramount+ and Apple TV+ originals released today (movies and TV). Data from Watchmode.", list: take(g => g.kind==="wm" && g.original).sort(byName)});
  out.push({id:"wmCat", title:"New on streaming: Added to catalog", sub:"Movies and shows those services added to their catalog today. Data from Watchmode.", list: take(g => g.kind==="wm").sort(byName)});
  out.push({id:"animePicks", title:"Anime picked for you", sub:"Ranked by how well genres and tags match what's in your library (isekai, dark fantasy, action, fantasy comedy).", list: take(g => g.kind==="anime" && g.score >= MAYBE_MATCH).sort((a,b)=> b.score-a.score || byTime(a,b))});
  out.push({id:"streaming", title:"Streaming", list: take(g => g.region==="Streaming").sort(byTime)});
  out.push({id:"us", title:"US TV", list: take(g => g.region==="US").sort(byTime)});
  out.push({id:"ca", title:"Canada TV", list: take(g => g.region==="Canada").sort(byTime)});
  out.push({id:"uk", title:"UK TV", list: take(g => g.region==="UK").sort(byTime)});
  out.push({id:"kj", title:"Korea & Japan", sub:"Live-action sci-fi, fantasy, horror, supernatural and action shows, plus Korean and Japanese shows on Netflix, Disney+ and other major streamers.", list: take(g => g.region==="KJ").sort(byTime)});
  out.push({id:"anime", title:"Other anime airing today", list: take(g => g.kind==="anime").sort((a,b)=> b.score-a.score || byTime(a,b))});
  const hiddenCount = items.filter(isHidden).length;
  const filteredCount = items.filter(g => !isHidden(g) && filteredOut(g)).length;
  return {secs: out, hiddenCount, filteredCount};
}

function card(g){
  const w = isWatching(g);
  const chips = [];
  if(g.isNewSeries) chips.push(`<span class="chip new">NEW SERIES</span>`);
  if(g.isSeasonPremiere) chips.push(`<span class="chip prem">SEASON PREMIERE</span>`);
  if(g.kind==="anime" && g.score >= STRONG_MATCH) chips.push(`<span class="chip match">Great match</span>`);
  else if(g.kind==="anime" && g.score >= MAYBE_MATCH) chips.push(`<span class="chip match">Possible match</span>`);
  if(g.kidsLabel) chips.push(`<span class="chip kids">Kids</span>`);
  if(isSeeded(g)) chips.push(`<span class="chip lib">In your library / likes</span>`);
  if(g.channel) chips.push(`<span class="chip net">${esc(g.channel)}</span>`);
  if(g.kind==="wm"){
    chips.push(`<span class="chip ${g.original?"new":"time"}">${g.original?"ORIGINAL":"Added to catalog"}</span>`);
  } else if(g.kind==="tv"){
    if(g.streamDrop) chips.push(`<span class="chip time">Streaming drop</span>`);
    else if(g.time) chips.push(`<span class="chip time">${esc(fmtTime(g.time))}</span>`);
  } else {
    chips.push(`<span class="chip time">${esc(fmtTime(g.time))} (Japan airing)</span>`);
  }
  if(g.kind==="tv" && g.type && g.type!=="Scripted") chips.push(`<span class="chip">${esc(g.type)}</span>`);
  if(g.kind==="anime" && g.country && g.country!=="JP") chips.push(`<span class="chip">${g.country==="CN"?"Donghua (China)":g.country==="KR"?"Korea":esc(g.country)}</span>`);
  (g.genres||[]).slice(0,3).forEach(x => chips.push(`<span class="chip">${esc(x)}</span>`));
  if(g.kind==="anime") g.tags.filter(t => (TAG_W[t]||0) >= 2).slice(0,3).forEach(t => chips.push(`<span class="chip">${esc(t)}</span>`));
  const links = [];
  if(g.kind==="wm"){
    if(g.imdb) links.push(`<a href="https://www.imdb.com/title/${esc(g.imdb)}/" target="_blank" rel="noopener">IMDb</a>`);
    if(g.tmdb) links.push(`<a href="https://www.themoviedb.org/${esc(g.tmdb)}" target="_blank" rel="noopener">TMDB</a>`);
  } else if(g.kind==="anime"){
    g.streams.forEach(s => links.push(`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.site)}</a>`));
    if(g.link) links.push(`<a href="${esc(g.link)}" target="_blank" rel="noopener">AniList</a>`);
  } else {
    if(g.site) links.push(`<a href="${esc(g.site)}" target="_blank" rel="noopener">Official site</a>`);
    if(g.region === "KJ") links.push(`<a href="https://mydramalist.com/search?q=${encodeURIComponent(g.title)}" target="_blank" rel="noopener">MyDramaList</a>`);
    if(g.link) links.push(`<a href="${esc(g.link)}" target="_blank" rel="noopener">TVmaze</a>`);
  }
  if(g.summary) links.push(`<a href="#" data-act="more">Summary</a>`);
  return `<div class="card${w?" watch":""}" data-key="${esc(g.key)}">
    <div class="poster" style="${g.image?`background-image:url('${esc(g.image)}')`:""}"></div>
    <div class="body">
      <div class="title">${g.link?`<a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(g.title)}</a>`:esc(g.title)}</div>
      ${g.alt?`<div class="ep">${esc(g.alt)}</div>`:""}
      <div class="ep">${esc(g.epLabel)}${g.epTitle?` · “${esc(g.epTitle)}”`:""}</div>
      <div class="meta">${chips.join("")}</div>
      <div class="links">${links.join("")}</div>
      <div class="summary">${esc(g.summary)}</div>
    </div>
    <div class="acts">
      <button class="star${w?" on":""}" data-act="star" title="${w?"Stop following":"Follow this show"}">${w?"★":"☆"}</button>
      <button class="hide" data-act="hide" title="Hide this show from now on">✕</button>
    </div>
  </div>`;
}

function render(){
  const {secs, hiddenCount, filteredCount} = sections();
  const tabs = [{id:"all", label:"All"}, ...secs.filter(s => s.list.length).map(s => ({id:s.id, label:s.title.replace("★ ",""), n:s.list.length}))];
  if(!tabs.some(t => t.id===activeTab)) activeTab = "all";
  $("#tabs").innerHTML = tabs.map(t => `<button class="tab${t.id===activeTab?" on":""}" data-tab="${t.id}">${esc(t.label)}${t.n!=null?`<span class="n">${t.n}</span>`:""}</button>`).join("")
    + `<span class="sub" style="margin:4px 0 0 8px">${filteredCount} filtered · ${hiddenCount} hidden</span>`;
  const shown = secs.filter(s => s.list.length && (activeTab==="all" || s.id===activeTab));
  if(!shown.length){ $("#main").innerHTML = `<div class="status">Nothing to show for this day with your current filters.</div>`; return; }
  $("#main").innerHTML = shown.map(s => {
    const col = activeTab==="all" && S.collapsed[s.id];
    return `<section data-sec="${s.id}" class="${col?"collapsed":""}">
      <h2><span class="caret">${col?"▸":"▾"}</span>${esc(s.title)} <span class="count">${s.list.length}</span></h2>
      ${s.sub?`<div class="sub">${esc(s.sub)}</div>`:""}
      <div class="grid">${s.list.map(card).join("")}</div></section>`;
  }).join("");
}

// ---------- Load a day ----------
let loadToken = 0;
async function loadDay(){
  const tok = ++loadToken;
  const dateStr = ymd(day);
  const isToday = dateStr === ymd(new Date());
  $("#dateLabel").textContent = (isToday ? "Today, " : "") + day.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
  $("#main").innerHTML = `<div class="status">Loading schedules for ${esc(dateStr)}…</div>`;
  const start = day.getTime(), end = start + 86400000;
  const errors = [];
  const [tv, an, wm] = await Promise.all([
    fetchTVmaze(dateStr).catch(e => { errors.push("TVmaze: "+e.message); return []; }),
    fetchAniList(start, end).catch(e => { errors.push(e.message.startsWith("AniList")?e.message:"AniList: "+e.message); return []; }),
    fetchWatchmode(dateStr).catch(e => { errors.push(e.message); return null; })
  ]);
  if(tok !== loadToken) return;
  items = [...buildTV(tv, dateStr), ...buildAnime(an), ...buildWatchmode(wm, dateStr)];
  render();
  if(errors.length) $("#main").insertAdjacentHTML("afterbegin", `<div class="status err">Couldn't load part of the schedule — ${esc(errors.join(" | "))}. Try ↻ in a minute.</div>`);
}

}

// ---------- Events ----------
let undo = null;
function toast(msg, undoFn){
  const t = $("#toast");
  t.innerHTML = esc(msg) + (undoFn ? `<button id="undoBtn">Undo</button>` : "");
  t.style.display = "block";
  undo = undoFn;
  if(undoFn) $("#undoBtn").onclick = () => { undo && undo(); t.style.display="none"; };
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display="none", 5000);
}
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if(tab){ activeTab = tab.dataset.tab; render(); window.scrollTo(0,0); return; }
  const h2 = e.target.closest("section>h2");
  if(h2 && activeTab==="all"){ const id = h2.parentElement.dataset.sec; S.collapsed[id] = !S.collapsed[id]; saveLocal(); render(); return; }
  const btn = e.target.closest("[data-act]");
  const cardEl = e.target.closest(".card");
  if(btn && cardEl){
    e.preventDefault();
    const g = items.find(x => x.key === cardEl.dataset.key); if(!g) return;
    if(btn.dataset.act === "more"){ cardEl.classList.toggle("open"); return; }
    if(btn.dataset.act === "hide"){
      S.hidden[g.key] = {title:g.title, at:Date.now()}; save(); render();
      toast(`Hidden “${g.title}”`, () => { delete S.hidden[g.key]; save(); render(); });
      return;
    }
    if(btn.dataset.act === "star"){
      if(isWatching(g)){ delete S.watching[g.key]; if(seedMatch(g.titles)) S.unwatch[g.key] = g.title; }
      else { S.watching[g.key] = g.title; delete S.unwatch[g.key]; }
      save(); render(); return;
    }
  }
  if(e.target.id === "drawer"){ $("#drawer").classList.remove("on"); return; }
  if(btn && btn.dataset.act === "close"){ $("#drawer").classList.remove("on"); return; }
  if(btn && btn.dataset.act === "connect"){
    const tok = ($("#tok").value || "").trim();
    if(!tok){ toast("Paste your GitHub token first"); return; }
    SY = {token: tok}; btn.disabled = true; btn.textContent = "Connecting…";
    (async () => {
      try{ SY.gistId = await findOrCreateGist(); saveSync(); await pull(); openSettings(); toast("Sync connected"); }
      catch(err){ SY = {}; saveSync(); setSync("error", err.message); openSettings(); toast("Couldn't connect: " + err.message); }
    })();
    return;
  }
  if(btn && btn.dataset.act === "disconnect"){ SY = {}; saveSync(); setSync(""); openSettings(); toast("Sync turned off on this device (your gist is kept)"); return; }
  if(btn && btn.dataset.act === "syncnow"){ pull(); return; }
  if(btn && btn.dataset.act === "wmsave"){
    const k = ($("#wmkey").value||"").trim();
    if(!/^[A-Za-z0-9]{20,80}$/.test(k)){ toast("That doesn't look like a Watchmode key"); return; }
    try{ localStorage.setItem(WM_KEY_STORE, k); localStorage.removeItem(WM_CACHE); }catch(e){}
    openSettings(); loadDay(); toast("Watchmode key saved"); return;
  }
  if(btn && btn.dataset.act === "wmremove"){ try{ localStorage.removeItem(WM_KEY_STORE); localStorage.removeItem(WM_CACHE); }catch(e){} openSettings(); loadDay(); toast("Watchmode key removed"); return; }
  if(btn && btn.dataset.act === "copy"){ const ta = $("#backup"); ta.select(); (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(()=>toast("Copied")).catch(()=>{document.execCommand("copy"); toast("Copied");}); return; }
  if(btn && btn.dataset.act === "import"){
    try{ const j = JSON.parse($("#backup").value); S = merge(structuredClone(DEFAULTS), j); save(); render(); openSettings(); toast("Settings loaded"); }
    catch(err){ toast("That text isn't a valid backup"); }
    return;
  }
  const un = e.target.closest("[data-unhide]");
  if(un){ delete S.hidden[un.dataset.unhide]; save(); render(); openSettings(); return; }
  const us = e.target.closest("[data-unstar]");
  if(us){ delete S.watching[us.dataset.unstar]; save(); render(); openSettings(); return; }
});
document.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.filter;
  if(k){ S.filters[k] = e.target.checked; save(); render(); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape") $("#drawer").classList.remove("on"); });
$("#settingsBtn").onclick = openSettings;
$("#prev").onclick = () => { day.setDate(day.getDate()-1); loadDay(); };
$("#next").onclick = () => { day.setDate(day.getDate()+1); loadDay(); };
$("#today").onclick = () => { day = new Date(); day.setHours(0,0,0,0); loadDay(); };
$("#refresh").onclick = loadDay;
$("#q").addEventListener("input", () => render());

loadDay();
pull();
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") pull(); });
</script>
