name: Update new-on-streaming data

on:
  schedule:
    - cron: "17 0,12 * * *"  # every 12 hours: 5:17 AM and 5:17 PM Arizona time
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-new-on-streaming
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch new titles
        env:
          MOTN_KEY: ${{ secrets.MOTN_KEY }}
          WATCHMODE_KEY: ${{ secrets.WATCHMODE_KEY }}
        run: node scripts/fetch-new.mjs
      - name: Save data
        run: |
          git config user.name "tv-today-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/new-on-streaming.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update new-on-streaming data"
          git pull --rebase origin main
          git push
